name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test feature sets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: huskarl-axum
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: huskarl-axum
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: huskarl-rs/huskarl
          path: huskarl
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: huskarl-rs/huskarl-login
          path: huskarl-login
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: huskarl-axum -> target
      - run: cargo test --all-features
      - run: cargo test --doc --all-features
      - run: cargo test --example login --features login
      - run: cargo test --example multi_resource
      - run: cargo test --no-default-features

  quality:
    name: Formatting, Clippy, and docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: huskarl-axum
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: huskarl-axum
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: huskarl-rs/huskarl
          path: huskarl
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: huskarl-rs/huskarl-login
          path: huskarl-login
          persist-credentials: false
      - run: rustup update stable --no-self-update && rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: huskarl-axum -> target
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps --all-features --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV (1.92)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: huskarl-axum
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: huskarl-axum
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: huskarl-rs/huskarl
          path: huskarl
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: huskarl-rs/huskarl-login
          path: huskarl-login
          persist-credentials: false
      - run: rustup toolchain install 1.92 --no-self-update --profile minimal && rustup default 1.92
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: huskarl-axum -> target
      - run: cargo test --all-features

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: huskarl-axum
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: huskarl-axum
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: huskarl-rs/huskarl
          path: huskarl
          persist-credentials: false
      - run: rustup update stable --no-self-update && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: huskarl-axum -> target
      - run: cargo check --lib --no-default-features --target wasm32-unknown-unknown
