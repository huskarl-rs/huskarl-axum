[package]
name = "huskarl-axum"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Axum middleware and extractors for the huskarl OAuth2 ecosystem."
repository = "https://github.com/huskarl-rs/huskarl-axum"
homepage = "https://github.com/huskarl-rs/huskarl-axum"
documentation = "https://docs.rs/huskarl-axum"
license = "MIT OR Apache-2.0"
keywords = ["oauth2", "oidc", "security", "authentication", "axum"]
categories = ["authentication", "web-programming"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[features]
login = ["dep:huskarl", "dep:huskarl-login", "dep:log"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["original-uri"] }
axum-core = { version = "0.5", default-features = false }
bon = { version = "3.9", features = ["experimental-generics-setters"] }
http = { version = "1", default-features = false }
huskarl-resource-server = { version = "0.11", path = "../huskarl/huskarl-resource-server" }
serde_json = { version = "1", default-features = false }
tower = { version = "0.5", default-features = false }

# login feature
huskarl = { version = "0.11", path = "../huskarl/huskarl", default-features = false, optional = true }
huskarl-login = { version = "0.3", path = "../huskarl-login", optional = true }
log = { version = "0.4", optional = true }

[dev-dependencies]
base64 = "0.22"
ciborium = "0.2"
axum = { version = "0.8", features = ["macros"] }
bytes = "1"
env_logger = "0.11"
tower = { version = "0.5", features = ["util"] }
huskarl-crypto-native = { version = "0.11", path = "../huskarl/huskarl-crypto-native" }
huskarl-login = { version = "0.3", path = "../huskarl-login" }
huskarl-reqwest = { version = "0.9", path = "../huskarl/huskarl-reqwest", features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full", "test-util"] }
url = "2"

[[example]]
name = "login"
required-features = ["login"]
